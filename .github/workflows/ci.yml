name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgfxim-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BGFX_REVISION: d8db55f8123a4a0871b1290fec2e5d0caae01bbf
  BX_REVISION: 9e3fadf6f11380031486be704d2ff46ca143664f
  BIMG_REVISION: 371d90098b1fd017cd00205979d5ef74b8c3ed62
  SDL_REVISION: 147a8ee32dbf9ac02f3794964490687b6bbda1bc

jobs:
  source:
    name: Reproducible sources and package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout bgfxim
        uses: actions/checkout@v7

      - name: Checkout bgfx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_REVISION }}
          path: _deps/bgfx

      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check package metadata
        run: nimble check

      - name: Test generator rejection paths
        run: python3 tests/test_generators.py

      - name: Verify reproducible sources and exhaustive tests
        run: |
          python3 tools/generate_defines.py \
            _deps/bgfx/include/bgfx/defines.h bgfx/defines.nim
          python3 tools/update_bindings.py \
            _deps/bgfx/include/bgfx/c99/bgfx.h bgfx.nim
          python3 tools/generate_abi_test.py bgfx.nim tests/test_abi.nim
          python3 tools/generate_value_test.py \
            bgfx.nim bgfx/defines.nim tests/test_values.nim
          git diff --exit-code -- \
            bgfx.nim bgfx/defines.nim tests/test_abi.nim tests/test_values.nim

  validation:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 · Nim 2.0 · GCC · refc · debug
            os: ubuntu-24.04
            nim: '2.0.16'
            python: python3
            options: --cc:gcc --mm:refc
          - name: Linux x64 · Nim 2.2 · GCC · orc · release
            os: ubuntu-24.04
            nim: '2.2.10'
            python: python3
            options: --cc:gcc --mm:orc -d:release
          - name: Linux x64 · Nim 2.2 · Clang · arc · debug · ASan/UBSan
            os: ubuntu-24.04
            nim: '2.2.10'
            python: python3
            sanitizers: true
            options: --cc:clang --mm:arc
          - name: Linux x86 · Nim 2.2 · GCC · refc · release
            os: ubuntu-24.04
            nim: '2.2.10'
            python: python3
            multilib: true
            options: >-
              --cc:gcc --mm:refc -d:release --cpu:i386
              --passC:-m32 --passL:-m32
          - name: macOS arm64 · Nim 2.2 · Clang · orc · release
            os: macos-15
            nim: '2.2.10'
            python: python3
            options: --cc:clang --mm:orc -d:release
          - name: macOS x64 · Nim 2.0 · Clang · refc · debug
            os: macos-15-intel
            nim: '2.0.16'
            python: python3
            options: --cc:clang --mm:refc
          - name: macOS x64 · Nim 2.2 · Clang · arc · release
            os: macos-15-intel
            nim: '2.2.10'
            python: python3
            options: --cc:clang --mm:arc -d:release
          - name: Windows 2022 x64 · Nim 2.0 · GCC · refc · debug
            os: windows-2022
            nim: '2.0.16'
            python: python
            options: --cc:gcc --mm:refc
          - name: Windows 2025 x64 · Nim 2.2 · GCC · orc · release
            os: windows-2025
            nim: '2.2.10'
            python: python
            options: --cc:gcc --mm:orc -d:release
          - name: Windows 2025 x64 · Nim 2.2 · GCC · arc · debug
            os: windows-2025
            nim: '2.2.10'
            python: python
            options: --cc:gcc --mm:arc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout bgfxim
        uses: actions/checkout@v7

      - name: Checkout bgfx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_REVISION }}
          path: _deps/bgfx

      - name: Checkout bx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bx
          ref: ${{ env.BX_REVISION }}
          path: _deps/bx

      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install 32-bit compiler support
        if: matrix.multilib == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib g++-multilib

      - name: Toolchain versions
        run: |
          nim --version
          ${{ matrix.python }} --version

      - name: Run compile, ABI, value, and executed FFI checks
        env:
          PYTHON: ${{ matrix.python }}
        run: >-
          tests/run_validation.sh _deps/bgfx _deps/bx
          ${{ matrix.options }}

      - name: Run error paths under address and undefined-behavior sanitizers
        if: matrix.sanitizers == true
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          nim c -r --path:. --cc:clang --mm:arc
          --nimcache:${{ runner.temp }}/bgfxim-errors-sanitized
          -o:${{ runner.temp }}/bgfxim-errors-sanitized-bin
          --passC:-I_deps/bgfx/include --passC:-I_deps/bx/include
          --passC:-fsanitize=address,undefined
          --passC:-fno-omit-frame-pointer
          --passL:-fsanitize=address,undefined
          tests/test_errors.nim

  cpp-header:
    name: C++20 header ABI and values
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout bgfxim
        uses: actions/checkout@v7

      - name: Checkout bgfx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_REVISION }}
          path: _deps/bgfx

      - name: Checkout bx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bx
          ref: ${{ env.BX_REVISION }}
          path: _deps/bx

      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ABI layout and values through C++20
        run: |
          nim cpp -r --path:. --cc:clang --passC:-std=c++20 \
            --passC:-I_deps/bgfx/include --passC:-I_deps/bx/include \
            tests/test_abi.nim
          nim cpp -r --path:. --cc:clang --passC:-std=c++20 \
            --passC:-I_deps/bgfx/include --passC:-I_deps/bx/include \
            tests/test_values.nim

  noop-runtime:
    name: NOOP runtime · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout bgfxim
        uses: actions/checkout@v7

      - name: Checkout bgfx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_REVISION }}
          path: _deps/bgfx

      - name: Checkout bx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bx
          ref: ${{ env.BX_REVISION }}
          path: _deps/bx

      - name: Checkout bimg
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bimg
          ref: ${{ env.BIMG_REVISION }}
          path: _deps/bimg

      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build real bgfx and run headless demos
        run: examples/run_noop_demos.sh _deps/bgfx _deps/bx _deps/bimg

  opengl-runtime:
    name: OpenGL renderer smoke · Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout bgfxim
        uses: actions/checkout@v7

      - name: Checkout bgfx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_REVISION }}
          path: _deps/bgfx

      - name: Checkout bx
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bx
          ref: ${{ env.BX_REVISION }}
          path: _deps/bx

      - name: Checkout bimg
        uses: actions/checkout@v7
        with:
          repository: bkaradzic/bimg
          ref: ${{ env.BIMG_REVISION }}
          path: _deps/bimg

      - name: Checkout SDL
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_REVISION }}
          path: _deps/sdl

      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenGL and X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config xauth xvfb \
            libgl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev

      - name: Build SDL 3
        run: |
          cmake -S _deps/sdl -B "${RUNNER_TEMP}/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_WAYLAND=OFF
          cmake --build "${RUNNER_TEMP}/sdl-build" --parallel 2
          cmake --install "${RUNNER_TEMP}/sdl-build"

      - name: Build and run real OpenGL triangle
        run: |
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/sdl/lib/pkgconfig:${RUNNER_TEMP}/sdl/lib64/pkgconfig"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/sdl/lib:${RUNNER_TEMP}/sdl/lib64"
          pkg-config --modversion sdl3
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 +extension GLX" \
            env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            examples/run_sdl_demo.sh _deps/bgfx _deps/bx _deps/bimg 3
